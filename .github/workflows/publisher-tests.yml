# Unit tests for the publisher scripts (no network, no secrets), on every change to them.
name: publisher-tests
on:
  push:
    paths: ['publisher/**']
  pull_request:
    paths: ['publisher/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest publisher/test_publish.py publisher/test_learn.py publisher/test_stats.py
