# Sends every Inbox channel's followers, likes and views to the Inbox Channels page once a day (see publisher/stats.py).
# Uses the same repository secrets as publish.yml. Read-only on the social accounts.
name: stats
on:
  schedule:
    # The Inbox timer starts this at 06:53 IST (JOBS in publisher/stats.py). This schedule stays as a fallback: it runs
    # hours late, a second run only refreshes the day's numbers, and it sends the Inbox its job list again if that is lost.
    - cron: '23 1 * * *'
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B publisher/stats.py
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SOCIAL_URL: ${{ secrets.SOCIAL_URL }}
          SOCIAL_TOKEN: ${{ secrets.SOCIAL_TOKEN }}
          PLATFORMS: instagram,facebook,youtube
