# Posts approved Inbox videos through Social Media Publisher (see publisher/publish.py).
# Needs repository secrets INBOX_URL, INBOX_TOKEN, SOCIAL_URL and SOCIAL_TOKEN.
name: publish
on:
  # No schedule here: GitHub's never fired for this repo. The Inbox starts this workflow at
  # the postTimesIST in platforms/*.json (publisher/stats.py sends them with channelStats).
  workflow_dispatch:
    inputs:
      post_now:
        description: 'Post the next approved video now, even if its scheduled time is later'
        type: boolean
        default: false
      item_id:
        description: 'Or post this video now (Inbox item id); a posted one gets only its missing platforms'
        type: string
        default: ''
      links_only:
        description: 'Only write the per-platform video links on Inbox items; post nothing'
        type: boolean
        default: false
concurrency: publish
permissions:
  contents: write # the publisher puts Instagram's copy of a video on the "instagram-uploads" release
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # up to 15 min wait per series group (3 Anaadi groups) plus the How To Hero post; runs can be 30 min apart, so a late one waits its turn (concurrency) and the engine plans for its own start time
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg  # ffprobe measures a video when its videoRef has no length
      - run: python3 -B -u publisher/replies.py  # approved comment replies out, new comments in
        if: ${{ !inputs.links_only }}
        continue-on-error: true  # a reply problem never stops a video post
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SOCIAL_URL: ${{ secrets.SOCIAL_URL }}
          SOCIAL_TOKEN: ${{ secrets.SOCIAL_TOKEN }}
      - run: python3 -B -u publisher/plan.py  # dry run of the series engine (publisher/series.json); reads only, posts nothing
        if: ${{ !inputs.links_only && !inputs.item_id && !inputs.post_now }}
        continue-on-error: true  # the dry run never stops a real post
        timeout-minutes: 3  # and never eats the post's share of the job's 60 minutes
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
      - run: python3 -B -u publisher/publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SOCIAL_URL: ${{ secrets.SOCIAL_URL }}
          SOCIAL_TOKEN: ${{ secrets.SOCIAL_TOKEN }}
          PLATFORMS: instagram,facebook,youtube
          POST_NOW: ${{ inputs.post_now }}
          ITEM_ID: ${{ inputs.item_id }}
          LINKS_ONLY: ${{ inputs.links_only }}
