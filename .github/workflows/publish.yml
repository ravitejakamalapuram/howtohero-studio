# Posts approved Inbox videos through Social Manager (see publisher/publish.py).
# Needs repository secrets INBOX_URL, INBOX_TOKEN, SOCIAL_URL and SOCIAL_TOKEN.
name: publish
on:
  schedule:
    # 3 posts a day at peak India times (cron is UTC): about 08:30, 13:00 and 19:30 IST.
    # GitHub delays or drops scheduled runs at busy times like :00 and :30, so these use odd minutes.
    - cron: '7 3 * * *'
    - cron: '37 7 * * *'
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      post_now:
        description: 'Post the next approved video now, even if its scheduled time is later'
        type: boolean
        default: false
      item_id:
        description: 'Or post this approved video now (Inbox item id)'
        type: string
        default: ''
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B publisher/publish.py
        env:
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SOCIAL_URL: ${{ secrets.SOCIAL_URL }}
          SOCIAL_TOKEN: ${{ secrets.SOCIAL_TOKEN }}
          PLATFORMS: instagram,facebook
          POST_NOW: ${{ inputs.post_now }}
          ITEM_ID: ${{ inputs.item_id }}
